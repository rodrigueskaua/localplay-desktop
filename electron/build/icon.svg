<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="fundo" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2E2E31"/>
      <stop offset="0.55" stop-color="#1B1B1C"/>
      <stop offset="1" stop-color="#121213"/>
